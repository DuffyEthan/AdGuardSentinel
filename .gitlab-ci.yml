stages:
- python-build
- python-test
- secret-detection
- test
sast:
  stage: test
include:
- template: Auto-DevOps.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
  AUTO_DEVOPS_BUILD_IMAGE: 'false'
  AUTO_DEVOPS_TEST: 'false'
  AUTO_DEVOPS_DEPLOY: 'false'
secret_detection:
  stage: secret-detection
python_build:
  stage: python-build
  image: python:3.11
  script:
    - echo "Uprading pip + installing dependencies..."
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  only:
    - branches
python_test:
  stage: python-test
  image: python:3.11
  needs:
    - python_build
  script:
    - echo "Running Python tests"
    - pytest #automatically finds test files
  only:
    - branches