include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

default:
  tags:
    - docker

stages:
  - build
  - test
  - deploy
  - docker-build
  - docker-test
  - deploy

variables:
  GIT_DEPTH: 0
  GITHUB_REPO: "DuffyEthan/AdGuardSentinel"

  #docker config stuff
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"

build:
  stage: build
  image: python:3.11
  script:
    - echo "Upgrading pip + installing dependencies..."
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt --no-cache-dir
  cache:
    paths:
      - .cache/pip
    policy: push
  only:
    - branches

test:
  stage: test
  image: python:3.11
  needs:
    - build
  script:
    - echo "Running Python tests"
    - pip install -r requirements.txt --no-cache-dir
    - pytest --cov=./ --cov-report=xml || true #automatically finds test files, won't fail if no tests
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - .cache/pip
  only:
    - branches

docker_build:
  stage: docker-build
  image: docker:latest
  services:
    - docker:dind
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH" #gitlab container registry variables
  needs:
    - test
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - |
      echo "Building Docker image from the Dockerfile, will be tagged to: $CI_REGISTRY_IMAGE"

      docker build \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE:latest" \
        --tag "adguard-sentinel:$CI_COMMIT_SHORT_SHA" \
        --tag "adguard-sentinel:latest" \
  artifacts:
    paths:
      - .docker/
    expire_in: 1 week
  only:
    - branches 

mirror_to_github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git 
  script:
    - |
      echo "Mirroring ${CI_COMMIT_REF_NAME} branch to GitHub..."


      git config --global user.email "duffyet@tcd.ie"
      git config --global user.name "duffyet"

      echo "https://DuffyEthan:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
      git config --global credential.helper 'store --file ~/.git-credentials'

      git fetch --all --tags

      git checkout -B ${CI_COMMIT_REF_NAME}

      git remote add github https://github.com/${GITHUB_REPO}.git 2>/dev/null || git remote set-url github https://github.com/${GITHUB_REPO}.git

      git push --force github HEAD:${CI_COMMIT_REF_NAME}

      echo "Successfully mirrored to GitHub"

  only:
    - branches
  when: manual #safety