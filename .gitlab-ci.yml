include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

default:
  tags:
    - docker

stages:
  - quality
  - build
  - test
  - docker-build
  - deploy

variables:
  GIT_DEPTH: 0
  GITHUB_REPO: "DuffyEthan/AdGuardSentinel"
  POETRY_VERSION: "1.8.5"
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"

cache:
  paths:
    - .cache/uv
    - .cache/pip
    - .cache/pypoetry
    - .venv/

.python-base:
  image: python:3.11
  before_script:
    - pip install --upgrade pip
    - pip install "poetry==$POETRY_VERSION"
    - poetry config virtualenvs.create false
    - pip install uv
    - "[ -d .venv ] || python -m venv .venv"
    - source .venv/bin/activate
  cache:
    paths:
      - .cache/uv
      - .cache/pip
      - .venv/
    policy: pull-push

flake8:
  extends: .python-base
  stage: quality
  script:
    - uv pip install flake8
    - echo "Running Flake8..."
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,.cache
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  allow_failure: true
  only:
    - branches

dependency_check:
  extends: .python-base
  stage: quality
  script:
    - uv pip install safety
    - echo "Check for vulnerable dependencies."
    - |
      safety check --full-report || echo "Vulnerabilities have been found, review required!"

      safety check --json > safety-report.json || true

      echo "DEPENDENCY REPORT"
      safety check --bare || echo "no issues discovered"
  artifacts:
    reports:
      sast: safety-report.json
    paths:
      - safety-report.json
  allow_failure: true
  only:
    - branches

black:
  extends: .python-base
  stage: quality
  script:
    - uv pip install black
    - echo "Running black for formatting checks"
    - black --check --diff . || echo "Code needs formatting, please run 'black .' on your local machine"
  allow_failure: true
  only:
    - branches

mypy:
  extends: .python-base
  stage: quality
  script: 
    - uv pip install mypy lxml
    - echo "Running mypy for type safety"
    - mypy --ignore-missing-imports --html-report mypy-html-report app/  db/  tests/ || true
  artifacts:
    when: always
    paths:
      - mypy-html-report/
    expire_in: 1 week
  allow_failure: true
  only:
    - branches

build:
  extends: .python-base
  stage: build
  script:
    - echo "Upgrading pip + installing dependencies..."
    - uv pip install -r requirements-prod.txt
    - uv pip install -r requirements-dev.txt
    - echo "Dependencies installed!"
  cache:
    paths:
      - .cache/pip
      - .cache/uv
      - .venv/
    policy: pull-push
  only:
    - branches

test:
  extends: .python-base
  stage: test
  services:
    - name: timescale/timescaledb:latest-pg16
      alias: db
      variables:
        POSTGRES_DB: StreamlitDB
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: changeme
  variables:
    DATABASE_URL: "postgresql://postgres:changeme@db:5432/StreamlitDB?sslmode=disable"
  needs:
    - build
  script:
    - echo "Installing test dependencies..."
    - if [ -f requirements-dev.txt ]; then
        uv pip install -r requirements-dev.txt;
      else
        uv pip install pytest pytest-cov;
      fi
    - echo "Installing dbmate..."
    - curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/latest/download/dbmate-linux-amd64
    - chmod +x /usr/local/bin/dbmate
    - echo "Running migrations..."
    - dbmate --wait --migrations-dir ./db/migrations --schema-file ./db/schema.sql up
    - echo "Running tests..."
    - pytest --cov=./ --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
  only:
    - branches

docker_build:
  stage: docker-build
  image: 
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH" #gitlab container registry variables
  needs:
    - test
  script:
    - |
      echo "Building Docker image from the Dockerfile, will be tagged to: $CI_REGISTRY_IMAGE"

      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}:latest" \
        --cache=true

      echo "Images available at ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  only:
    - branches 

mirror_to_github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git 
  script:
    - |
      echo "Mirroring ${CI_COMMIT_REF_NAME} branch to GitHub..."


      git config --global user.email "duffyet@tcd.ie"
      git config --global user.name "duffyet"

      echo "https://DuffyEthan:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
      git config --global credential.helper 'store --file ~/.git-credentials'

      git fetch --all --tags

      git checkout -B ${CI_COMMIT_REF_NAME}

      git remote add github https://github.com/${GITHUB_REPO}.git 2>/dev/null || git remote set-url github https://github.com/${GITHUB_REPO}.git

      git push --force github HEAD:${CI_COMMIT_REF_NAME}

      echo "Successfully mirrored to GitHub"

  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success