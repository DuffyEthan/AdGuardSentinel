include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

before_script:
  -echo "Cleaning up disk space..."
  -df -h
  -apt-get update && apt-get install -y ncdu || true
  -ncdu -x / || true
  -rm -rf /tmp/* || true
  -rm 0rf /var/tmp/* || true

build:
  stage: build
  image: python:3.11
  tags:
    - docker
  script:
    - echo "Upgrading pip + installing dependencies..."
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  cache:
    key: pip-cache
    paths:
      - .cache/pip
    policy: push
  only:
    - branches

test:
  stage: test
  image: python:3.11
  needs:
    - build
  tags:
    - docker
  script:
    - echo "Running Python tests"
    - pip install -r requirements.txt
    - pytest || true #automatically finds test files, won't fail if no tests
  only:
    - branches