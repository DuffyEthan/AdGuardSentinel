include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

default:
  tags:
    - docker

stages:
  - quality
  - build
  - test
  - docker-build
  - deploy

variables:
  GIT_DEPTH: 0
  GITHUB_REPO: "DuffyEthan/AdGuardSentinel"

flake8:
  stage: quality
  image: python:3.11
  script:
    - pip install flake8 flake8-json flake8-gitlab
    - echo "Running Flake8..."
    - flake8 . --format=gitlab --output-file=gl-codequality-report.json || echo "[]" > gl-codequality-report.json
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  artifacts:
    reports:
      codequality:  gl-codequality-report.json
    paths:
      - gl-codequality-report.json
  allow_failure: true
  only:
    - branches

black:
  stage: quality
  image: python:3.11
  script:
    - pip install black
    - echo "Running black for formatting checks"
    - black --check --diff . || echo "Code needs formatting, please run 'black .' on your local machine"
  allow_failure: true
  only:
    - branches

mypy:
  stage: quality
  image: python:3.11
  script: 
    - pip install mypy lxml
    - pip install -r requirements.txt
    - echo "Running mypy for type safety"
    - mypy --ignore-missing-imports --html-report mypy-html-report app/  db/  tests/ || true
  artifacts:
    when: always
    paths:
      - mypy-html-report/
    expire_in: 1 week
  allow_failure: true
  only:
    - branches

build:
  stage: build
  image: python:3.11
  script:
    - echo "Upgrading pip + installing dependencies..."
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt --no-cache-dir
  cache:
    paths:
      - .cache/pip
    policy: push
  only:
    - branches

test:
  stage: test
  image: python:3.11
  needs:
    - build
  script:
    - echo "Running Python tests"
    - pip install -r requirements.txt --no-cache-dir
    - pytest --cov=./ --cov-report=xml || true #automatically finds test files, won't fail if no tests
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - .cache/pip
  only:
    - branches

docker_build:
  stage: docker-build
  image: 
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH" #gitlab container registry variables
  needs:
    - test
  script:
    - |
      echo "Building Docker image from the Dockerfile, will be tagged to: $CI_REGISTRY_IMAGE"

      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}:latest" \
        --cache=true

      echo "Images available at ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  only:
    - branches 

mirror_to_github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git 
  script:
    - |
      echo "Mirroring ${CI_COMMIT_REF_NAME} branch to GitHub..."


      git config --global user.email "duffyet@tcd.ie"
      git config --global user.name "duffyet"

      echo "https://DuffyEthan:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
      git config --global credential.helper 'store --file ~/.git-credentials'

      git fetch --all --tags

      git checkout -B ${CI_COMMIT_REF_NAME}

      git remote add github https://github.com/${GITHUB_REPO}.git 2>/dev/null || git remote set-url github https://github.com/${GITHUB_REPO}.git

      git push --force github HEAD:${CI_COMMIT_REF_NAME}

      echo "Successfully mirrored to GitHub"

  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: on_success