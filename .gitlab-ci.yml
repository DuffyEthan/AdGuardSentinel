include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

default:
  tags:
    - docker

stages:
  - build
  - test
  - docker-build
  - docker-test
  - deploy

variables:
  GIT_DEPTH: 0
  GITHUB_REPO: "DuffyEthan/AdGuardSentinel"

  #docker config stuff
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "/certs/client"

build:
  stage: build
  image: python:3.11
  script:
    - echo "Upgrading pip + installing dependencies..."
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt --no-cache-dir
  cache:
    paths:
      - .cache/pip
    policy: push
  only:
    - branches

test:
  stage: test
  image: python:3.11
  needs:
    - build
  script:
    - echo "Running Python tests"
    - pip install -r requirements.txt --no-cache-dir
    - pytest --cov=./ --cov-report=xml || true #automatically finds test files, won't fail if no tests
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - .cache/pip
  only:
    - branches

docker_build:
  stage: docker-build
  image: 
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  variables:
    CI_REGISTRY_IMAGE: "$CI_REGISTRY/$CI_PROJECT_PATH" #gitlab container registry variables
  needs:
    - test
  script:
    - |
      echo "Building Docker image from the Dockerfile, will be tagged to: $CI_REGISTRY_IMAGE"

      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}" \
        --destination "${CI_REGISTRY_IMAGE}:latest" \
        --cache=true

      echo "Images available at ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  only:
    - branches 
  
docker_test:
  stage: docker-test
  image: docker:latest
  variables:
    DOCKER_BUILDKIT: 1
  needs: 
    - docker_build
  script:
    - |
      echo "Testing Docker image."
      docker build -t local-test .

      echo "Testing Streamlit."
      docker run --rm local-test streamlit --version

      echo "Test app entry point."
      timeout 5s docker run --rm -p 8501:8501 local-test || \

      echo "check dependencies"
      docker run --rm local-test pip list | grep -E "(streamlit|pandas|sqlalchemy)" | head -5

      echo "Docker testing passed!"
  only:
    - branches

mirror_to_github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git 
  script:
    - |
      echo "Mirroring ${CI_COMMIT_REF_NAME} branch to GitHub..."


      git config --global user.email "duffyet@tcd.ie"
      git config --global user.name "duffyet"

      echo "https://DuffyEthan:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
      git config --global credential.helper 'store --file ~/.git-credentials'

      git fetch --all --tags

      git checkout -B ${CI_COMMIT_REF_NAME}

      git remote add github https://github.com/${GITHUB_REPO}.git 2>/dev/null || git remote set-url github https://github.com/${GITHUB_REPO}.git

      git push --force github HEAD:${CI_COMMIT_REF_NAME}

      echo "Successfully mirrored to GitHub"

  only:
    - branches
  when: manual #safety