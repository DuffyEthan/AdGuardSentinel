include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml

build:
  stage: build
  image: python:3.11
  tags:
    - docker
  script:
    - echo "Upgrading pip + installing dependencies..."
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  cache:
    paths:
      - .cache/pip
  only:
    - branches

test:
  stage: test
  image: python:3.11
  needs:
    - build
  tags:
    - docker
  script:
    - echo "Running Python tests"
    - pip install -r requirements.txt
    - pytest || true #automatically finds test files, won't fail if no tests
  cache:
    paths:
      - .cache/pip
  only:
    - branches