[tool.poetry]
name = "sweng26-group20-adguardanomalydetection"
version = "0.1.0"
description = "AdGuard metrics visualisation & analysis"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11"
starlette = ">=0.49.1"
psycopg = {version = "*", extras = ["binary"]}
pandas = ">=2.3.3"
sqlalchemy = "*"
matplotlib = "*"
sqlacodegen = "*"
python-dotenv = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"

[tool.poetry.requires-plugins]
poetry-plugin-export = ">=1.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"