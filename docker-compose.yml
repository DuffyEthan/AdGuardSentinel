services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: app_timescale_db
    restart: unless-stopped
    env_file:
      - ./.secrets/.env
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      app-network:

  fastapi:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - ./.secrets/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.fastapi.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      app-network:

  orchestrator:
    build: .
    env_file:
      - ./.secrets/.env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: python -m app.orchestrator
    restart: unless-stopped
    networks:
      app-network:

volumes:
  db_data:
networks:
  app-network:
